[package]
name="tls-memory-probe"
version="0.1.0"
edition="2021"
publish=false
[dependencies]
rustls={version="=0.23.46",default-features=false,features=["ring","std"]}
tokio={version="=1.54.1",features=["rt-multi-thread","macros","net","io-util"]}
tokio-rustls={version="=0.26.6",default-features=false,features=["ring"]}
rustls-pemfile="=2.2.0"
[profile.audit]
inherits="release"
lto="thin"
codegen-units=1
debug=2
strip="none"
