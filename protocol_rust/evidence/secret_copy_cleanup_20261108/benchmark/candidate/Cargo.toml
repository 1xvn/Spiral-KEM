[package]
name = "spiral-secret-copy-benchmark"
version = "0.0.0"
edition = "2021"
publish = false
[dependencies]
sha2 = { version = "=0.11.1", features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
hkdf = { version = "=0.13.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
zeroize = "=1.9.1"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[patch.crates-io]
digest = { path = "/workspace/spiral-secret-copy-cleanup-20261108/third_party/rustcrypto/digest" }
hmac = { path = "/workspace/spiral-secret-copy-cleanup-20261108/third_party/rustcrypto/hmac" }
hkdf = { path = "/workspace/spiral-secret-copy-cleanup-20261108/third_party/rustcrypto/hkdf" }
ed25519-dalek = { path = "/workspace/spiral-secret-copy-cleanup-20261108/third_party/rustcrypto/ed25519-dalek" }
curve25519-dalek = { path = "/workspace/spiral-secret-copy-cleanup-20261108/third_party/rustcrypto/curve25519-dalek" }
