[package]
name = "spiral-protocol"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
publish = false
build = "build.rs"

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"
x509-parser = "0.18"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.2"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
async-trait = "0.1"
serde_json = "1.0"
hex = "0.4"

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[dev-dependencies]
static_assertions = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "spiral-lab"
path = "src/main.rs"
