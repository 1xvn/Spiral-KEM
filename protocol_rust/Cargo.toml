[package]
name = "spiral-protocol"
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
publish = false
build = "build.rs"

[features]
default = []
parser-fuzz = []
record-fuzz = []

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "2.2"
x509-parser = "0.18"
# These stable versions add state cleanup; sha2's feature also covers dalek's hasher.
sha2 = { version = "=0.11.1", features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
hkdf = { version = "=0.13.0", features = ["zeroize"] }
chacha20poly1305 = "0.10"
# Unify the pinned AEAD dependency's Poly1305 state-cleanup feature.
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
getrandom = "0.2"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
async-trait = "0.1"
serde_json = "1.0"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process"] }

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[dev-dependencies]
static_assertions = "1.1"
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.audit]
inherits = "release"
debug = 2
strip = "none"

[[bin]]
name = "spiral-lab"
path = "src/main.rs"

# Scoped cleanup patches; the upstream versions and original source hashes are
# recorded in third_party/rustcrypto/upstream-provenance.json.
[patch.crates-io]
digest = { path = "../third_party/rustcrypto/digest" }
hmac = { path = "../third_party/rustcrypto/hmac" }
hkdf = { path = "../third_party/rustcrypto/hkdf" }
ed25519-dalek = { path = "../third_party/rustcrypto/ed25519-dalek" }
curve25519-dalek = { path = "../third_party/rustcrypto/curve25519-dalek" }
