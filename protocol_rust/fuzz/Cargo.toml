[package]
name = "spiral-parser-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.10"
spiral-protocol = { path = "..", features = ["parser-fuzz", "record-fuzz"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 1
debug = 1
codegen-units = 1
lto = false
panic = "abort"

[[bin]]
name = "frame_target"
path = "frame_target.rs"
test = false
doc = false

[[bin]]
name = "record_target"
path = "record_target.rs"
test = false
doc = false

[[bin]]
name = "record_replay"
path = "record_replay.rs"
test = true
doc = false

[[bin]]
name = "hello_target"
path = "hello_target.rs"
test = false
doc = false

[[bin]]
name = "replay_target"
path = "replay_target.rs"
test = false
doc = false

# A nested workspace must opt into the same pinned local patches explicitly.
[patch.crates-io]
digest = { path = "../../third_party/rustcrypto/digest" }
hmac = { path = "../../third_party/rustcrypto/hmac" }
hkdf = { path = "../../third_party/rustcrypto/hkdf" }
ed25519-dalek = { path = "../../third_party/rustcrypto/ed25519-dalek" }
curve25519-dalek = { path = "../../third_party/rustcrypto/curve25519-dalek" }
